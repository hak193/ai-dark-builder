<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dark - Code Generator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <!-- Highlight.js for syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1b26;
            color: #a9b1d6;
        }
    </style>
</head>
<body class="min-h-screen">
    <div id="app" class="h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-[#1a1b26] border-b border-gray-700 p-4">
            <h1 class="text-2xl font-semibold text-white">AI Dark</h1>
        </header>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <div class="flex-1 flex">
                <!-- Chat Section -->
                <div v-show="activeTab === 'chat'" class="flex-1 flex flex-col bg-[#1a1b26] border-r border-gray-700">
                    <div class="flex-1 overflow-y-auto p-4" id="chat-messages">
                        <div class="space-y-4">
                            <div class="text-center" v-if="messages.length === 0">
                                <h2 class="text-xl text-gray-300 mb-2">Hello! What kind of app would you like to create today?</h2>
                                <p class="text-gray-400">Feel free to ask anything or start a new conversation.</p>
                            </div>
                            
                            <!-- Template Suggestions -->
                            <div class="flex flex-wrap gap-2 justify-center mt-4" v-if="messages.length === 0">
                                <button 
                                    v-for="template in templates" 
                                    :key="template"
                                    @click="selectTemplate(template)"
                                    class="px-4 py-2 bg-gray-700 rounded-lg text-sm hover:bg-gray-600 transition-colors">
                                    {{ template }}
                                </button>
                            </div>

                            <!-- Chat Messages -->
                            <div v-for="(message, index) in messages" :key="index" 
                                 :class="['p-4 rounded-lg', message.isUser ? 'bg-blue-600 ml-12' : 'bg-gray-700 mr-12']">
                                {{ message.content }}
                            </div>
                        </div>
                    </div>
                    
                    <!-- Chat Input -->
                    <div class="p-4 border-t border-gray-700">
                        <div class="relative">
                            <textarea 
                                v-model="userInput"
                                @keyup.enter="handleSubmit"
                                class="w-full bg-gray-700 text-white rounded-lg pl-4 pr-12 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                rows="1"
                                placeholder="What app you want to create?"
                            ></textarea>
                            <button 
                                @click="handleSubmit"
                                :disabled="isGenerating"
                                class="absolute right-2 top-1/2 transform -translate-y-1/2 text-blue-500 hover:text-blue-400">
                                <i class="fas" :class="isGenerating ? 'fa-spinner fa-spin' : 'fa-paper-plane'"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Editor Section -->
                <div v-show="activeTab === 'editor'" class="flex-1 bg-[#1a1b26] flex flex-col">
                    <div class="flex-1 p-4 overflow-auto">
                        <pre><code class="language-javascript">{{ generatedCode || '// Your code will appear here...' }}</code></pre>
                    </div>
                </div>

                <!-- Preview Section -->
                <div v-show="activeTab === 'preview'" class="flex-1 bg-[#1a1b26] flex flex-col">
                    <div class="flex-1 p-4">
                        <div class="h-full flex flex-col items-center justify-center">
                            <canvas 
                                id="gameCanvas" 
                                width="400" 
                                height="400" 
                                class="border-2 border-gray-700 rounded-lg bg-[#1a1b26]"
                            ></canvas>
                            <div class="mt-4 text-gray-400">
                                Use arrow keys to control the snake
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom Navigation -->
            <nav class="bg-[#1a1b26] border-t border-gray-700 p-2">
                <div class="flex justify-around">
                    <button 
                        @click="switchTab('chat')"
                        :class="['flex flex-col items-center p-2', activeTab === 'chat' ? 'text-blue-500' : 'text-gray-400 hover:text-blue-500']">
                        <i class="fas fa-comments mb-1"></i>
                        <span class="text-xs">Chat</span>
                    </button>
                    <button 
                        @click="switchTab('editor')"
                        :class="['flex flex-col items-center p-2', activeTab === 'editor' ? 'text-blue-500' : 'text-gray-400 hover:text-blue-500']">
                        <i class="fas fa-code mb-1"></i>
                        <span class="text-xs">Editor</span>
                    </button>
                    <button 
                        @click="switchTab('preview')"
                        :class="['flex flex-col items-center p-2', activeTab === 'preview' ? 'text-blue-500' : 'text-gray-400 hover:text-blue-500']">
                        <i class="fas fa-eye mb-1"></i>
                        <span class="text-xs">Preview</span>
                    </button>
                    <button 
                        @click="switchTab('menu')"
                        :class="['flex flex-col items-center p-2', activeTab === 'menu' ? 'text-blue-500' : 'text-gray-400 hover:text-blue-500']">
                        <i class="fas fa-bars mb-1"></i>
                        <span class="text-xs">Menu</span>
                    </button>
                </div>
            </nav>
        </main>
    </div>

    <!-- App Logic -->
    <script src="assets/js/app.js"></script>
</body>
</html>
